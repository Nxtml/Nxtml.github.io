<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer id="model" src="train_animation.glb" ar ar-modes="scene-viewer webxr quick-look" camera-controls tone-mapping="neutral" poster="poster.png" shadow-intensity="1" animation-name="wheels backAction" autoplay>
      <button class="Hotspot" slot="hotspot-1" data-surface="3 0 20769 20770 20771 0.572 0.361 0.067" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Front</div>
      </button><button class="Hotspot" slot="hotspot-2" data-surface="4 0 771 772 773 0.013 0.688 0.299" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Back carriage</div>
      </button><button class="Hotspot" slot="hotspot-3" data-surface="5 0 2046 2047 2048 0.086 0.419 0.495" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Hinge</div>
      </button><button class="Hotspot" slot="hotspot-5" data-surface="2 0 1476 1410 1475 0.064 0.362 0.574" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Back wheels</div>
      </button><button class="Hotspot" slot="hotspot-6" data-surface="1 0 3556 3531 3563 0.287 0.119 0.594" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Front wheels</div>
      </button>
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>




         <div class="controls" style="position: absolute; bottom: 20px; right: 20px; background: #ececec; padding: 12px; border-radius: 10px; border: 1px solid #ccc;">
      <h3 style="margin: 0 0 8px 0; color: rgb(98, 77, 115);">Toy Train</h3>


      <div><strong>Variants:</strong>
  <button onclick="VBtn01()">Red lightning</button>
  <button onclick="VBtn02()">Blue thunder</button>
  <button onclick="VBtn03()">Green hurricane</button>
</div>

      <div><strong>Views:</strong>
        <button onClick="setOrbit('-77.56deg 87.65deg 9.315m')">Front</button>
        <button onClick="setOrbit('-77.56deg 0.0000573deg 9.315m')">Top</button>
        <button onClick="setOrbit('-77.2deg 180deg 9.315m')">Bottom</button>
      </div>

      <div><strong>Animations:</strong> 
      <button onClick="Btn01()">Front</button>
      <button onClick="Btn02()">Hinge</button>
      <button onClick="Btn03()">Back</button>
      <button onClick="pauseAnimation()">Pause Animation</button>
      </div>
    </div>

   <script>
    function setOrbit(orbit) {
      document.getElementById('model').cameraOrbit=orbit;
    }
  </script>

   <script>
   function addhotspot1(){
     document.getElementById("hotspot1").style.visibility="visible"
   }
   function removehotspot1(){
    document.getElementById("hotspot1").style.visibility="hidden"
   }
   function addhotspot2(){
    document.getElementById("hotspot2").style.visibility="visible"
   }
   function removehotspot2(){
    document.getElementById("hotspot2").style.visibility="hidden"
   }
   function addhotspot1(){
     document.getElementById("hotspot3").style.visibility="visible"
   }
   function removehotspot1(){
    document.getElementById("hotspot3").style.visibility="hidden"
   }
   function addhotspot2(){
    document.getElementById("hotspot5").style.visibility="visible"
   }
   function removehotspot2(){
    document.getElementById("hotspot5").style.visibility="hidden"
   }
   function addhotspot2(){
    document.getElementById("hotspot6").style.visibility="visible"
   }
   function removehotspot2(){
    document.getElementById("hotspot6").style.visibility="hidden"
   }
  </script>

  <script>
function setOrbit(orbit){
  document.getElementById('model').cameraOrbit=orbit;
}
<script>
  function VBtn01(){
    document.getElementById("model").varientName="Red lightning"
  }
   function VBtn02(){
    document.getElementById("model").varientName="Blue thunder"
  }
   function VBtn03(){
    document.getElementById("model").varientName="Green hurricane"
  }
</script>

<script>
  function Btn01() {
    const model = document.getElementById('model');
    model.pause();
    model.animationName = "bodyAction";
    model.play();
  }

  function Btn02() {
    const model = document.getElementById('model');
    model.pause();
    model.animationName = "hingeAction";
    model.play();
  }

  function Btn03() {
    const model = document.getElementById('model');
    model.pause();
    model.animationName = "backAction";
    model.play();
  }

  function pauseAnimation() {
    document.getElementById('model').pause();
  }
</script>



    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </body>
</html>
